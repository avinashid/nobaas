[package]
name = "nobaas-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An optional always-on Nobaas peer: keeps one identity across restarts and relays for the peers linked to it"
publish = false

[dependencies]
nobaas = { path = "../nobaas" }
# A fresh identity on first start (already in the tree through nobaas).
rand_core = { version = "0.6", features = ["getrandom"] }
