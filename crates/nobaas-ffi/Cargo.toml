[package]
name = "nobaas-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for nobaas-core: one surface for a zero-import WebAssembly module (browsers) and native FFI (Dart, Swift, C)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
nobaas-core = { path = "../nobaas-core" }
rand_core = "0.6"
rand_chacha = "0.3"
k256 = { version = "0.13", default-features = false, features = ["schnorr", "arithmetic"] }

[dev-dependencies]
# The fuzz harness (nobaas_sim::fuzz).
nobaas-sim = { path = "../nobaas-sim" }
