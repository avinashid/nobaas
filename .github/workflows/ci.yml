name: CI

# Lean on purpose: the repo is private and every minute counts against the Actions quota.
# Linux only, two jobs, cached builds, superseded runs cancelled.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: test + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  wasm:
    name: wasm + node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/web"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./packages/js/build.sh
      - name: Size (<= 350 KiB) and zero imports
        run: node .github/scripts/wasm-check.mjs packages/js/pkg/nobaas_ffi.wasm 358400
      - run: node packages/js/test/node_pair.mjs

  # Next: a `godot` job building the GDExtension (NB-020) goes here, Linux only to start.
