<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nobaas: pull-style room</title>
<style>
  :root { color-scheme: dark; --bg: #0f1117; --panel: #181b24; --line: #2a2f3d; --text: #e6e8ee; --dim: #8b91a3; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  main { width: min(720px, 100vw - 32px); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--dim); }
  canvas { width: 100%; aspect-ratio: 16 / 9; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  footer { display: flex; gap: 16px; justify-content: space-between; margin-top: 10px; color: var(--dim); font-size: 13px; }
  code { color: var(--text); }
</style>
<main>
  <h1>Pull-style room</h1>
  <p>Driven the way a game engine (Godot's JavaScriptBridge) drives it: every frame, <code>room.poll()</code> for plain events and <code>room.sendTo()</code> for positions. Arrow keys move your dot; open more tabs.</p>
  <canvas id="view" width="1280" height="720"></canvas>
  <footer><span>me <code id="me">…</code></span><span id="peers">alone</span><span id="events">0 events</span></footer>
</main>
<script type="module" src="poll.js"></script>
</html>
