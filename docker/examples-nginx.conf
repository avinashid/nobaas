# Static server for the Nobaas browser demos. Runs as a non-root user on a read-only root filesystem:
# the pid file and temp paths live in /tmp (a tmpfs in docker-compose.yml).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /srv;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location / {
            # GET and HEAD only: there is nothing to post to.
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
